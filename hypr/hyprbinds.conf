$terminal = kitty
$browser = zen-browser
$menu = wofi --show drun
$fileManager = yazi

$ipc = qs -c noctalia-shell ipc call

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER_L

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, left, dispatcher, layoutmsg, move +col
gesture = 3, right, dispatcher, layoutmsg, move -col
gesture = 4, pinch, fullscreen

# convenience binds
bind = $mainMod, Return, exec, uwsm app -- $terminal
bind = $mainMod, f, exec, uwsm app -- $terminal yazi
bind = $mainMod, b, exec, uwsm app -- $browser

# noctalia shell
bind = $mainMod, c, exec, $ipc settings toggle
bind = $mainMod, SPACE, exec, $ipc controlCenter toggle
bind = $mainMod, Tab, exec, $ipc sessionMenu toggle
bindr = WIN, SUPER_L, exec, $ipc launcher toggle
bind = $mainMod, n, exec, $ipc notifications dismissAll
bind = $mainMod, i, exec, $ipc idleInhibitor toggle
bind = $mainMod, q, exec, $ipc notifications toggleDND
# bind = WIN, l, exec, $ipc lockScreen lock

# misc window binds
bind = $mainMod, v, togglefloating,
bind = $mainMod, x, killactive,
# bind = $mainMod, p, pseudo, # dwindle
bind = $mainMod, p, pin,
bind = , f11, fullscreen, 0 toggle
bind = $mainMod, m, fullscreen, 1 toggle

# scrolling layout
bind = $mainMod, period, layoutmsg, swapcol r
bind = $mainMod, comma, layoutmsg, swapcol l
bind = $mainMod, slash, layoutmsg, colresize +conf

# hide current window immediately
bind = $mainMod, d, togglespecialworkspace, hidden
bind = $mainMod, d, movetoworkspace, +0
bind = $mainMod, d, togglespecialworkspace, hidden
bind = $mainMod, d, movetoworkspace, special:hidden
bind = $mainMod, d, togglespecialworkspace, hidden

# go to hidden workspace
bind = $mainMod+Shift, d, togglespecialworkspace, hidden

# screenshot binds
bind = $mainMod+Shift, p, exec, hyprshot -m region
bind = $mainMod, p, exec, hyprshot -m window
bind = $mainMod+Ctrl, p, exec, hyprshot -m output

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, s, togglespecialworkspace, magic
bind = $mainMod SHIFT, s, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move/resize windows with keyboard
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
binde = $mainMod ALT, h, moveactive, -30 0
binde = $mainMod ALT, l, moveactive, 30 0
binde = $mainMod ALT, k, moveactive, 0 -30
binde = $mainMod ALT, j, moveactive, 0 30
binde = $mainMod CTRL, h, resizeactive, -20 0
binde = $mainMod CTRL, l, resizeactive, 20 0
binde = $mainMod CTRL, k, resizeactive, 0 -20
binde = $mainMod CTRL, j, resizeactive, 0 20

# spawn floating kitty jiffy app launcher
$applicationMenu = kitty -1 -o allow_remote_control=yes --class=applicationMenu --title=applicationMenu -o background_opacity=$overlay_window_opacity jiffy -m a --refresh -x wl-copy -i 'OS.exec(["kitty", "@", "set-spacing", "margin=0"])' -r -p 3 -s 15

windowrule = float true, match:title ^(applicationMenu)$ 
windowrule = center 1, match:title ^(applicationMenu)$
windowrule = size 1000 600, match:title ^(applicationMenu)$ 
windowrule = animation slide up, match:title ^(applicationMenu)$
windowrule = rounding 10, match:title ^(applicationMenu)$
windowrule = dim_around true, match:title ^(applicationMenu)$
windowrule = pin true, match:title ^(applicationMenu)$
windowrule = stay_focused true, match:title ^(applicationMenu)$

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = ,XF86AudioLowerVolume, exec, $ipc volume decrease
bindel = ,XF86AudioMute, exec, $ipc volume muteOutput
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = ,XF86MonBrightnessDown, exec, $ipc brightness decrease

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Laptop lid
bindl = , switch:on:Lid Switch, exec, $ipc lockScreen lockAndSuspend
bindl = , switch:off:Lid Switch, exec, $ipc lockScreen lock

# Laptop fan speed (UX3402ZA, from https://github.com/dominiksalvet/asus-fan-control/issues/151#issuecomment-2614086607)
bind = $mainMod+ALT, p, exec, pkexec /bin/performance-mode.sh & notify-send "Fan mode" "Fans set to performance mode" --app-name="Fans"
bind = $mainMod+ALT, b, exec, pkexec /bin/balanced-mode.sh & notify-send "Fan mode" "Fans set to balanced mode" --app-name="Fans"
bind = $mainMod+ALT, q, exec, pkexec /bin/quiet-mode.sh & notify-send "Fan mode" "Fans set to quiet mode" --app-name="Fans"
